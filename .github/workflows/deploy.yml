name: Deploy Obsidian Notes to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

# Set permissions for GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    name: Build Quartz Site
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Vault
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Quartz Engine & Build Static Site
        run: |
          # 1. Clone official Quartz v4 into an isolated build directory
          git clone --depth 1 -b v4 https://github.com/jackyzha0/quartz.git /tmp/quartz
          cd /tmp/quartz
          npm ci

          # 2. Apply custom Quartz configurations if provided
          if [ -d "$GITHUB_WORKSPACE/.github/quartz" ]; then
            echo "Applying custom Quartz configuration and layouts..."
            cp -r "$GITHUB_WORKSPACE/.github/quartz/"* .
          fi

          # 3. Clean default sample content in Quartz
          rm -rf content/*

          # 4. Copy vault notes and assets into Quartz content directory
          rsync -av \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='.gitignore' \
            --exclude='.agent' \
            --exclude='.agents' \
            --exclude='.obsidian' \
            --exclude='tools' \
            --exclude='AGENTS.md' \
            --exclude='GEMINI.md' \
            --exclude='*.canvas' \
            --exclude='*.base' \
            --exclude='*.AppImage' \
            --exclude='*.sh' \
            "$GITHUB_WORKSPACE/" content/

          # 5. Populate folder index files from README.md
          if [ -f content/README.md ] && [ ! -f content/index.md ]; then
            cp content/README.md content/index.md
          fi

          find content -type f -name "README.md" | while read -r readme; do
            dir=$(dirname "$readme")
            if [ ! -f "$dir/index.md" ]; then
              cp "$readme" "$dir/index.md"
            fi
          done

          # 6. Execute Quartz build
          npx quartz build -o "$GITHUB_WORKSPACE/_site"
          touch "$GITHUB_WORKSPACE/_site/.nojekyll"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    name: Deploy to GitHub Pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
